<div class="card h-100">

  <img 
    *ngIf="trip.image"
    [src]="trip.image"
    class="card-img-top"
    alt="{{ trip.name }}">

  <div class="card-body">

    <h5 class="card-title">
      {{ trip.name }}
    </h5>

    <p class="card-text">
      <strong>Resort:</strong> {{ trip.resort }} <br>
      <strong>Price:</strong> ${{ trip.perPerson }} <br>
      <strong>Length:</strong> {{ trip.length }} days
    </p>

    <p class="card-text">
      {{ trip.description }}
    </p>

    <!-- Book Button -->
    <button
      *ngIf="!isLoggedIn()"
      class="btn btn-primary w-100"
      (click)="bookTrip(trip.code)">
      Book
    </button>

    <!-- Edit/Delete for Admin -->
    <div *ngIf="isLoggedIn()" class="d-flex gap-2">
      <button
        class="btn btn-warning w-50"
        (click)="editTrip(trip)">
        Edit
      </button>

      <button
        class="btn btn-danger w-50"
        (click)="deleteTrip(trip)">
        Delete
      </button>
    </div>

  </div>

</div>
